problems:
  - status: 404
    title: Unknown game
    detail: >-
      Returned by /gosloto/next.json, /lotto/next.json and /world/next.json
      when the optional ?game= query names a game the family does not carry.
    remediation: Omit the game parameter to get every game in the family, or use a game key from the family's latest.json response.
    operations:
      - GET /gosloto/next.json
      - GET /lotto/next.json
      - GET /world/next.json
  - status: 404
    title: No draws for that year or date
    detail: >-
      Returned by /uk49s/{year}.json and /uk49s/draws/{date}.json when the
      year predates the archive (before 2018) or no draw exists for the date.
    remediation: Use a year from 2018 onward or a date present in /uk49s/draws.json.
    operations:
      - GET /uk49s/{year}.json
      - GET /uk49s/draws/{date}.json
