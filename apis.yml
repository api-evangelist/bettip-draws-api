name: BetTip Draws API
description: >-
  A free, keyless lottery-results data feed providing JSON and CSV results for UK49s, Russia Gosloto, the South African
  National Lottery, and a small set of world draws. Backed by a public OpenAPI 3.0.3 contract, open CORS, HTTPS, and no
  authentication. Operated by Easybet Group (Pty) Ltd under the BetTip brand; data is CC BY 4.0.
